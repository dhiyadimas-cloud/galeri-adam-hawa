<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeri Adam Hawa – Manajemen Order</title>
<style>
:root{--bg:#f5f1ff;--card:#fff;--tx:#1f1535;--mut:#6e6590;--ln:#e4dcf8;--ac:#6d28d9;--ac2:#efe9ff;--g1:#e6dbff;--g2:#fff;--rd:#c0392b;--yl:#c98a00;--gr:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f26;--card:#201838;--tx:#f1ecff;--mut:#a79fc7;--ln:#3a2f60;--ac:#b79bff;--ac2:#2d2250;--g1:#2a1858;--g2:#150f26}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:14px 16px 4px}h1{margin:0;font-size:20px;color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{white-space:nowrap;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:20px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:8px 12px 40px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:12px;color:var(--mut);display:block;margin:8px 0 3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.btn{border:0;background:var(--ac);color:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn.s{background:var(--ac2);color:var(--ac)}.btn.d{background:transparent;color:var(--rd);padding:4px 8px}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;color:#fff}
.r{background:var(--rd)}.y{background:var(--yl)}.g{background:var(--gr)}.n{background:var(--mut)}
.it{display:grid;grid-template-columns:2fr 1fr 70px 30px;gap:6px;margin-bottom:6px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.m{color:var(--mut);font-size:13px}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--ln);text-align:left}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.box{background:var(--card);border-radius:14px;padding:14px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.hide{display:none}.warn{background:var(--ac2);padding:8px;border-radius:8px;font-size:13px;margin:6px 12px}

body{background:linear-gradient(170deg,var(--g1) 0%,var(--g2) 60%) fixed;min-height:100vh}
.hd{background:linear-gradient(135deg,#3b1d7a,#7c3aed 62%,#a78bfa);color:#fff;padding:16px 18px 22px;border-radius:0 0 26px 26px;box-shadow:0 8px 24px #5b21b655}
.lg{position:relative;display:inline-block}.lg img{height:62px;display:block}.hs{font-size:13px;opacity:.85;margin-top:4px}
.bd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;border:2px solid var(--card);animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.bd.big{position:absolute;top:-8px;right:-16px;min-width:24px;height:24px;font-size:12px;border-color:#fff}
.ico .bd{position:absolute;top:-8px;right:-10px}nav .bd{margin-left:6px;border-color:transparent}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
nav{background:transparent;backdrop-filter:blur(10px)}nav button{border-radius:22px;transition:.2s}nav button:hover{transform:translateY(-2px);border-color:var(--ac)}
nav button.on{background:linear-gradient(135deg,#6d28d9,#8b5cf6);box-shadow:0 4px 12px #7c3aed55}
.card{border-radius:18px;box-shadow:0 4px 18px #7c3aed14}.btn{background:linear-gradient(135deg,#6d28d9,#8b5cf6);box-shadow:0 4px 12px #7c3aed44;transition:.2s}.btn:hover{transform:translateY(-1px)}
.btn.s{background:var(--ac2);color:var(--ac);box-shadow:none}.btn.d{background:transparent;box-shadow:none}
input:focus,select:focus,textarea:focus{outline:2px solid #8b5cf6;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.sc{cursor:pointer;animation:up .5s both;transition:transform .2s,box-shadow .2s}.sc:hover{transform:translateY(-4px);box-shadow:0 10px 26px #7c3aed33}
.ico{position:relative;width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,#6d28d9,#a78bfa);display:grid;place-items:center;font-size:23px;margin-bottom:10px}
.big2{font-size:30px;font-weight:700;color:var(--ac)}.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
.lgd{font-size:13px;margin:3px 0}.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.pb{height:12px;border-radius:8px;background:var(--ac2);margin-top:8px;overflow:hidden}.pb div{height:100%;background:linear-gradient(90deg,#6d28d9,#a78bfa);border-radius:8px;transition:width .8s}
nav button{display:inline-flex;align-items:center;gap:7px}nav button svg{color:var(--ac)}nav button.on svg{color:#fff}
.ico{background:var(--ac2);color:var(--ac);border:1px solid var(--ln)}
</style></head><body>

function modal(h){$("#mod").dataset.open=1;$("#mod").innerHTML=`<div class="modal"><div class="box">${h}</div></div>`}
function close(){$("#mod").innerHTML="";delete $("#mod").dataset.open;draw()}
async function dl(name,data){try{const d=await claude.use("downloads");if(!d){alert("Unduh tidak tersedia di tampilan ini.");return}await d.save({filename:name,data})}catch(e){if(e&&e.code!=="declined")alert("Gagal menyimpan: "+(e.code||e))}}
function vTrack(){const a=[...O].sort((x,y)=>(x.status==="Selesai")-(y.status==="Selesai")||(x.deadline||"9").localeCompare(y.deadline||"9"));
 $("#app").innerHTML=a.map(o=>{const[u,c]=urg(o),s=sisa(o),pt=s<=0?["Lunas","g"]:(o.paid>0?["DP","y"]:["Belum bayar","r"]);
 return`<div class="card"><div class="top"><b>${esc(o.no)} · ${esc(o.customer)}</b><span><span class="tag ${c}">${u}</span> <span class="tag ${pt[1]}">${pt[0]}</span></span></div><div class="m">${o.items.map(i=>esc(i.name)).join(", ")} · deadline ${esc(o.deadline||"-")}</div><div class="m">Total ${rp(tot(o))} · terbayar ${rp(o.paid)} · <b>sisa ${rp(Math.max(0,s))}</b></div><div class="top" style="margin-top:8px;justify-content:flex-start"><select data-s="${o.id}" style="max-width:190px">${STATUS.map(x=>`<option ${x===o.status?"selected":""}>${x}</option>`).join("")}</select>${s>0?`<input type="number" placeholder="Bayar (Rp)" data-p="${o.id}" style="max-width:130px"><button class="btn s" data-a="${o.id}">Catat</button><button class="btn s" data-l="${o.id}">Lunas</button>`:""}<button class="btn s" data-v="${o.id}">Invoice</button></div></div>`}).join("")||'<div class="card m">Belum ada order.</div>';
 $("#app").onchange=e=>{const id=e.target.dataset.s;if(id){const o=O.find(x=>x.id===id);save("orders",id,{...strip(o),status:e.target.value})}};
 $("#app").onclick=e=>{const d=e.target.dataset;if(d.v)invoice(O.find(x=>x.id===d.v));
  if(d.a){const v=+document.querySelector(`[data-p="${d.a}"]`).value;if(v>0){const o=O.find(x=>x.id===d.a);save("orders",d.a,{...strip(o),paid:(+o.paid||0)+v})}}
  if(d.l){const o=O.find(x=>x.id===d.l);save("orders",d.l,{...strip(o),paid:tot(o)})}}}
function vPay(){const a=O.filter(o=>sisa(o)>0);
 $("#app").innerHTML=`<div class="top"><h3>Belum lunas (${a.length})</h3><button class="btn" id="tg">Tagih</button></div>`+a.map(o=>`<div class="card"><div class="top"><b>${esc(o.no)} · ${esc(o.customer)}</b><span class="tag ${(o.paid>0)?"y":"r"}">${o.paid>0?"DP":"Belum bayar"}</span></div><div class="m">Total ${rp(tot(o))} · terbayar ${rp(o.paid)} · <b>sisa ${rp(sisa(o))}</b> · tempo ${esc(o.tempo||"-")}</div><div class="top" style="margin-top:6px"><input type="number" placeholder="Tambah pembayaran" data-p="${o.id}" style="max-width:180px"><button class="btn s" data-a="${o.id}">Catat</button></div></div>`).join("")||'<div class="card m">Semua order sudah lunas</div>';

 $("#app").onclick=e=>{const id=e.target.dataset.a;if(id){const v=+document.querySelector(`[data-p="${id}"]`).value;if(v>0){const o=O.find(x=>x.id===id);save("orders",id,{...strip(o),paid:(+o.paid||0)+v})}}}}
function cp(s,b,el){const l=b.textContent,ok=()=>{b.textContent="Tersalin";setTimeout(()=>b.textContent=l,1500)},fb=()=>{el.focus();el.select();let r=false;try{r=document.execCommand("copy")}catch(e){}if(r)ok();else{b.textContent="Tekan Ctrl+C";setTimeout(()=>b.textContent=l,2500)}};navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(s).then(ok,fb):fb()}

 const tp=T.length?T.map(t=>[t.name,t.text,t.id]):DEF_TPL.map(t=>[t[0],t[1],null]);sel=a[0].id;

 const url=()=>{const o=O.find(x=>x.id===$("#to").value);return o?`https://wa.me/${wa(o.wa)}?text=${encodeURIComponent($("#tx").value)}`:""},upd=()=>{$("#lk").value=url()};const fill=()=>{const o=O.find(x=>x.id===$("#to").value);$("#tx").value=tp[+$("#tt2").value][1].replace(/{nama}/g,o.customer).replace(/{invoice}/g,o.no).replace(/{sisa}/g,rp(sisa(o))).replace(/{total}/g,rp(tot(o))).replace(/{tempo}/g,o.tempo||"-");upd()};fill();$("#tx").oninput=upd;

 ["y","m","d"].forEach(k=>$("#f"+k).onchange=e=>{F[k]=e.target.value;if(k==="d"&&F.d){F.y="";F.m=""}draw()});
